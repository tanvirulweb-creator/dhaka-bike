<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. Sound Synthesizer ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.engineOsc = null;
        this.engineGain = null;
        this.isEngineRunning = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted && this.engineGain) {
          this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }
        return this.isMuted;
      }
      startEngine() {
        this.init();
        if (!this.ctx || this.isEngineRunning) return;
        try {
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.setValueAtTime(65, this.ctx.currentTime);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(260, this.ctx.currentTime);
          this.engineGain.gain.setValueAtTime(this.isMuted ? 0 : 0.08, this.ctx.currentTime);
          this.engineOsc.connect(filter);
          filter.connect(this.engineGain);
          this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
          this.isEngineRunning = true;
        } catch(e) {}
      }
      updateEngine(ratio) {
        if (!this.ctx || !this.isEngineRunning || !this.engineOsc) return;
        try {
          const f = 60 + ratio * 105;
          this.engineOsc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.05);
          if (!this.isMuted && this.engineGain) {
            this.engineGain.gain.setTargetAtTime(0.06 + ratio * 0.05, this.ctx.currentTime, 0.05);
          }
        } catch(e) {}
      }
      stopEngine() {
        if (this.engineOsc) {
          try { this.engineOsc.stop(); this.engineOsc.disconnect(); } catch(e) {}
          this.engineOsc = null;
        }
        this.isEngineRunning = false;
      }
      playHorn() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const playBeep = (time, dur, f1, f2) => {
          const o1 = this.ctx.createOscillator();
          const o2 = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o1.type = 'square'; o2.type = 'sawtooth';
          o1.frequency.setValueAtTime(f1, time);
          o2.frequency.setValueAtTime(f2, time);
          g.gain.setValueAtTime(0.18, time);
          g.gain.exponentialRampToValueAtTime(0.001, time + dur);
          o1.connect(g); o2.connect(g); g.connect(this.ctx.destination);
          o1.start(time); o2.start(time); o1.stop(time + dur); o2.stop(time + dur);
        };
        const now = this.ctx.currentTime;
        playBeep(now, 0.12, 440, 554);
        playBeep(now + 0.15, 0.15, 466, 587);
      }
      playCoin() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.3);
      }
      playNitro() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.6);
      }
      playCrash() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        noise.connect(filter); filter.connect(g); g.connect(this.ctx.destination);
        noise.start(now);
      }
      playNearMiss() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.2);
      }
      playMilestone() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = this.ctx.currentTime;
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.09);
          g.gain.setValueAtTime(0.2, now + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.25);
        });
      }
      playVictory() {
        this.init();
        if (!this.ctx || this.isMuted) return;
        const melody = [{f:523.25,d:0.15},{f:659.25,d:0.15},{f:783.99,d:0.15},{f:1046.50,d:0.35},{f:880.00,d:0.15},{f:1046.50,d:0.5}];
        let t = this.ctx.currentTime;
        melody.forEach(note => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(note.f, t);
          g.gain.setValueAtTime(0.18, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + note.d);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(t); osc.stop(t + note.d);
          t += note.d + 0.04;
        });
      }
    }
    const sounds = new SoundManager();

    // --- 2. Upgraded 3D Models ---
    const createMat = (color, r = 0.35, m = 0.15) =>
      new THREE.MeshStandardMaterial({ color, roughness: r, metalness: m, flatShading: true });

    function createPlayerBike() {
      const group = new THREE.Group();
      const bike = new THREE.Group();

      const tireGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.22, 16);
      const tireMat = createMat(0x1a1a1a, 0.9, 0.1);
      const rimMat = createMat(0xdcdde1, 0.2, 0.85);

      const makeWheel = (z) => {
        const w = new THREE.Group();
        const t = new THREE.Mesh(tireGeo, tireMat); t.rotation.z = Math.PI / 2;
        const r = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.23, 10), rimMat); r.rotation.z = Math.PI / 2;
        w.add(t, r); w.position.set(0, 0.38, z); return w;
      };
      bike.add(makeWheel(-0.95), makeWheel(0.85));

      const bodyMat = createMat(0x0984e3, 0.2, 0.3);
      const darkMat = createMat(0x1e272e, 0.5, 0.2);

      const engine = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.42, 0.9), darkMat); engine.position.set(0, 0.6, -0.05);
      const frontCowl = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.45, 0.7), bodyMat); frontCowl.position.set(0, 0.82, -0.75); frontCowl.rotation.x = -0.35;
      const ws = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.3, 0.05), new THREE.MeshStandardMaterial({ color: 0x111, transparent: true, opacity: 0.8 })); ws.position.set(0, 1.1, -0.85); ws.rotation.x = -0.55;
      const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.06), new THREE.MeshBasicMaterial({ color: 0x00f0ff })); hlL.position.set(-0.16, 0.78, -1.1);
      const hlR = hlL.clone(); hlR.position.x = 0.16;
      const tank = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.35, 0.65), bodyMat); tank.position.set(0, 0.95, -0.22);
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.14, 0.7), darkMat); seat.position.set(0, 0.9, 0.35);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.45), bodyMat); tail.position.set(0, 0.92, 0.85); tail.rotation.x = 0.2;
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.05), new THREE.MeshBasicMaterial({ color: 0xff0033 })); tl.position.set(0, 0.92, 1.08);

      bike.add(engine, frontCowl, ws, hlL, hlR, tank, seat, tail, tl);

      // Rider
      const rider = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.62, 0.3), darkMat); torso.position.set(0, 1.28, 0.05); torso.rotation.x = 0.42;
      const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.44), bodyMat); helmet.position.set(0, 1.72, -0.15);
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.18, 0.12), new THREE.MeshStandardMaterial({ color: 0x00cec9, roughness: 0.1, metalness: 0.9 })); visor.position.set(0, 1.72, -0.38);
      rider.add(torso, helmet, visor);

      group.add(bike, rider);
      group.userData = { tailLight: tl };
      return group;
    }

    function createDhakaBuilding(type = 0) {
      const group = new THREE.Group();
      const colors = [0xf5cd79, 0xf8a5c2, 0x78e08f, 0x6a89cc, 0xe55039];
      const bMat = createMat(colors[type % colors.length], 0.85);
      const h = 16 + (type % 4) * 6;
      const bldg = new THREE.Mesh(new THREE.BoxGeometry(10, h, 12), bMat);
      bldg.position.set(0, h / 2, 0);
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 2.0, 12), createMat(0x0097e6));
      tank.position.set(-2, h + 1.5, 1.5);
      group.add(bldg, tank);
      return group;
    }

    function createCNG() {
      const group = new THREE.Group();
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 2.5), createMat(0x1b873a)); chassis.position.set(0, 0.4, 0);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.7), createMat(0x1b873a)); cabin.position.set(0, 1.1, 0.35);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.18, 2.3), createMat(0xf1c40f)); roof.position.set(0, 1.75, 0.05);
      const nose = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.9, 0.9), createMat(0x1b873a)); nose.position.set(0, 0.85, -0.9);
      const ws = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.55, 0.08), new THREE.MeshStandardMaterial({ color: 0x81ecec, transparent: true, opacity: 0.65 })); ws.position.set(0, 1.35, -0.65); ws.rotation.x = 0.25;
      group.add(chassis, cabin, roof, nose, ws);
      group.userData = { type: 'cng', length: 2.6, width: 1.6 };
      return group;
    }

    function createBus(type = 0) {
      const group = new THREE.Group();
      const colors = [{b: 0xc0392b, s: 0xf1c40f, n: 'রাইদা পরিবহন'}, {b: 0x2980b9, s: 0xffffff, n: 'অনাবিল স্পেশাল'}];
      const t = colors[type % colors.length];
      const bldg = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.2, 6.8), createMat(t.b)); bldg.position.set(0, 1.5, 0);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.34, 0.35, 6.75), createMat(t.s)); stripe.position.set(0, 1.3, 0);
      group.add(bldg, stripe);
      group.userData = { type: 'bus', length: 7.0, width: 2.4, name: t.n };
      return group;
    }

    function createRickshaw() {
      const group = new THREE.Group();
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.25, 0.7), createMat(0xb53471)); seat.position.set(0, 0.85, 0.5);
      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.85, 0.75), createMat(0x009432)); hood.position.set(0, 1.35, 0.55);
      const puller = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.3), createMat(0x0652dd)); puller.position.set(0, 1.0, -0.2);
      group.add(seat, hood, puller);
      group.userData = { type: 'rickshaw', length: 2.2, width: 1.4 };
      return group;
    }

    function createCoin() {
      const group = new THREE.Group();
      const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.85, roughness: 0.15 }));
      coin.rotation.x = Math.PI / 2;
      group.add(coin);
      group.position.y = 0.9;
      group.userData = { type: 'coin' };
      return group;
    }

    function createChaiCup() {
      const group = new THREE.Group();
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.18, 0.45, 12), createMat(0xd35400, 0.8));
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffeaa7, transparent: true, opacity: 0.4 }));
      group.add(cup, glow);
      group.position.y = 0.9;
      group.userData = { type: 'chai' };
      return group;
    }

    const STAGES = [
      { id: 1, name: 'যাত্রাবাড়ী', subtitle: 'Jatrabari Bus Terminal', startM: 0, endM: 2500 },
      { id: 2, name: 'প্রগতি সরণি', subtitle: 'Progoti Saroni (Badda/JFP)', startM: 2500, endM: 5500 },
      { id: 3, name: 'কুড়িল ফ্লাইওভার', subtitle: 'Kuril Flyover Expressway', startM: 5500, endM: 8000 },
      { id: 4, name: 'বিমানবন্দর সড়ক', subtitle: 'Airport Road Highway', startM: 8000, endM: 10500 },
      { id: 5, name: 'উত্তরা হাউস বিল্ডিং', subtitle: 'Uttara House Building (Finish)', startM: 10500, endM: 12000 }
    ];

    // --- 3. React App Component ---
    function App() {
      const [gameState, setGameState] = useState('START');
      const [score, setScore] = useState(0);
      const [speed, setSpeed] = useState(0);
      const [distanceM, setDistanceM] = useState(0);
      const [coins, setCoins] = useState(0);
      const [nitroActive, setNitroActive] = useState(false);
      const [nitroTime, setNitroTime] = useState(0);
      const [stagePopup, setStagePopup] = useState(null);
      const [nearMissPopup, setNearMissPopup] = useState(null);
      const [isMuted, setIsMuted] = useState(false);

      const canvasContainerRef = useRef(null);
      const engineRef = useRef({
        scene: null, camera: null, renderer: null, player: null,
        playerPos: { x: 0, y: 0, z: 0 }, playerVelX: 0, speed: 0,
        nitroActive: false, nitroTime: 0, distanceM: 0, stageIdx: 0,
        score: 0, coins: 0, keys: { left: false, right: false, up: false, down: false, horn: false },
        traffic: [], collectibles: [], roadChunks: [], lastTime: 0, animId: null
      });

      // Controls
      useEffect(() => {
        const onDown = (e) => {
          const g = engineRef.current;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') g.keys.left = true;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') g.keys.right = true;
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') g.keys.up = true;
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') g.keys.down = true;
          if (e.key === ' ' || e.key === 'h' || e.key === 'H') {
            if (!g.keys.horn) triggerHorn();
            g.keys.horn = true;
          }
        };
        const onUp = (e) => {
          const g = engineRef.current;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') g.keys.left = false;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') g.keys.right = false;
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') g.keys.up = false;
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') g.keys.down = false;
          if (e.key === ' ' || e.key === 'h' || e.key === 'H') g.keys.horn = false;
        };
        window.addEventListener('keydown', onDown);
        window.addEventListener('keyup', onUp);
        return () => {
          window.removeEventListener('keydown', onDown);
          window.removeEventListener('keyup', onUp);
        };
      }, []);

      const triggerHorn = () => {
        sounds.playHorn();
        const g = engineRef.current;
        g.traffic.forEach(item => {
          if (item.mesh.userData.type === 'rickshaw') {
            const dist = Math.abs(item.mesh.position.z - g.playerPos.z);
            if (dist < 32 && item.mesh.position.z < g.playerPos.z) {
              item.targetX = -5.0;
            }
          }
        });
      };

      // Three.js Scene Setup
      useEffect(() => {
        const cont = canvasContainerRef.current;
        if (!cont) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x74b9ff);
        scene.fog = new THREE.FogExp2(0x74b9ff, 0.009);

        const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 350);
        camera.position.set(0, 4.4, 7.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        cont.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const sun = new THREE.DirectionalLight(0xfffaed, 0.95);
        sun.position.set(30, 50, 20);
        scene.add(sun);

        const player = createPlayerBike();
        scene.add(player);

        // Road & Buildings
        const roadChunks = [];
        const CHUNK_LEN = 60;
        const roadGeo = new THREE.PlaneGeometry(13, CHUNK_LEN);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2d3436 });
        const walkMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });

        for (let i = 0; i < 8; i++) {
          const chunk = new THREE.Group();
          const road = new THREE.Mesh(roadGeo, roadMat); road.rotation.x = -Math.PI / 2;
          const leftW = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.45, CHUNK_LEN), walkMat); leftW.position.set(-8.25, 0.22, 0);
          const rightW = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.45, CHUNK_LEN), walkMat); rightW.position.set(8.25, 0.22, 0);

          // Buildings
          const bLeft = createDhakaBuilding(i % 5); bLeft.position.set(-16, 0, -CHUNK_LEN / 4); bLeft.rotation.y = Math.PI / 2;
          const bRight = createDhakaBuilding((i + 2) % 5); bRight.position.set(16, 0, CHUNK_LEN / 4); bRight.rotation.y = -Math.PI / 2;

          chunk.add(road, leftW, rightW, bLeft, bRight);
          chunk.position.set(0, 0, -i * CHUNK_LEN);
          scene.add(chunk);
          roadChunks.push(chunk);
        }

        const g = engineRef.current;
        g.scene = scene; g.camera = camera; g.renderer = renderer;
        g.player = player; g.roadChunks = roadChunks; g.lastTime = performance.now();

        const onResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // Game Loop
      useEffect(() => {
        const g = engineRef.current;
        if (gameState === 'PLAYING') sounds.startEngine();
        else sounds.stopEngine();

        const tick = (now) => {
          const dt = Math.min((now - g.lastTime) / 1000, 0.1);
          g.lastTime = now;

          if (gameState === 'PLAYING') {
            // Speed controls (gentle baseline 28 km/h, up to 68 on gas, brake to 12)
            let tgt = 28;
            if (g.keys.up) tgt = 68;
            if (g.keys.down) tgt = 12;
            if (g.nitroActive) {
              tgt = 110;
              g.nitroTime -= dt;
              if (g.nitroTime <= 0) {
                g.nitroActive = false;
                setNitroActive(false);
              } else {
                setNitroTime(Math.ceil(g.nitroTime));
              }
            }
            const rate = g.keys.down ? 4.5 : (g.keys.up ? 3.0 : 2.0);
            g.speed += (tgt - g.speed) * dt * rate;

            const fwd = g.speed * 1.4 * dt;
            g.playerPos.z -= fwd;
            g.distanceM += fwd * 5.0;

            sounds.updateEngine(g.speed / 110);

            // Responsive Snappy Steer
            let steer = 0;
            if (g.keys.left) steer -= 1;
            if (g.keys.right) steer += 1;
            g.playerVelX += (steer * 11.5 - g.playerVelX) * dt * 10.0;
            g.playerPos.x += g.playerVelX * dt;
            g.playerPos.x = Math.max(-5.5, Math.min(5.5, g.playerPos.x));

            g.player.position.set(g.playerPos.x, g.playerPos.y, g.playerPos.z);
            g.player.rotation.z = -g.playerVelX * 0.055;
            g.player.rotation.y = -g.playerVelX * 0.025;

            // Camera
            g.camera.position.x += (g.playerPos.x * 0.65 - g.camera.position.x) * dt * 6.0;
            g.camera.position.z = g.playerPos.z + 7.6;
            g.camera.lookAt(g.playerPos.x * 0.6, 1.4, g.playerPos.z - 12);

            // Road recycling
            g.roadChunks.forEach(c => {
              if (c.position.z > g.playerPos.z + 60) c.position.z -= g.roadChunks.length * 60;
            });

            // Stage Check
            const currentStage = STAGES.find(s => g.distanceM >= s.startM && g.distanceM < s.endM) || STAGES[STAGES.length - 1];
            if (currentStage.id !== g.stageIdx + 1) {
              g.stageIdx = currentStage.id - 1;
              sounds.playMilestone();
              setStagePopup(currentStage);
              setTimeout(() => setStagePopup(null), 3000);
            }

            // Manage Traffic
            if (g.traffic.length < 8) {
              const spawnZ = g.playerPos.z - (70 + Math.random() * 60);
              const r = Math.random();
              const vMesh = r < 0.38 ? createCNG() : (r < 0.76 ? createBus(Math.floor(Math.random()*2)) : createRickshaw());
              const lanes = [-4.2, -1.8, 1.8, 4.2];
              const lx = lanes[Math.floor(Math.random() * lanes.length)];
              vMesh.position.set(lx, 0, spawnZ);
              g.scene.add(vMesh);
              g.traffic.push({ mesh: vMesh, speed: 18 + Math.random() * 18, targetX: lx, passed: false });
            }

            for (let i = g.traffic.length - 1; i >= 0; i--) {
              const item = g.traffic[i];
              item.mesh.position.z -= item.speed * dt * 1.4;
              if (item.targetX !== undefined) {
                item.mesh.position.x += (item.targetX - item.mesh.position.x) * dt * 3.5;
              }

              const dx = Math.abs(item.mesh.position.x - g.playerPos.x);
              const dz = Math.abs(item.mesh.position.z - g.playerPos.z);
              const width = item.mesh.userData.width || 1.6;
              const len = item.mesh.userData.length || 2.5;

              // Near miss
              if (!item.passed && dz < len * 0.8 && dx > width * 0.45 && dx < width * 0.95) {
                item.passed = true;
                sounds.playNearMiss();
                g.score += 250;
                setNearMissPopup('🔥 ওস্তাদ এক ইঞ্চি বাঁচলেন! +250');
                setTimeout(() => setNearMissPopup(null), 1500);
              }

              // Hit
              if (dx < (width * 0.42 + 0.28) && dz < (len * 0.45 + 0.45)) {
                if (g.nitroActive) {
                  item.mesh.position.y += 3;
                  g.score += 500;
                } else {
                  sounds.playCrash();
                  setGameState('GAMEOVER');
                  return;
                }
              }

              if (item.mesh.position.z > g.playerPos.z + 20) {
                g.scene.remove(item.mesh);
                g.traffic.splice(i, 1);
              }
            }

            // Manage Collectibles
            if (g.collectibles.length < 5) {
              const spawnZ = g.playerPos.z - (50 + Math.random() * 80);
              const lanes = [-3.8, -1.8, 1.8, 3.8];
              const lx = lanes[Math.floor(Math.random() * lanes.length)];
              const isChai = Math.random() < 0.24;
              const cMesh = isChai ? createChaiCup() : createCoin();
              cMesh.position.set(lx, 0.9, spawnZ);
              g.scene.add(cMesh);
              g.collectibles.push({ mesh: cMesh, type: isChai ? 'chai' : 'coin' });
            }

            for (let i = g.collectibles.length - 1; i >= 0; i--) {
              const item = g.collectibles[i];
              item.mesh.rotation.y += dt * 3.5;
              const dx = Math.abs(item.mesh.position.x - g.playerPos.x);
              const dz = Math.abs(item.mesh.position.z - g.playerPos.z);
              if (dx < 1.1 && dz < 1.3) {
                if (item.type === 'coin') {
                  sounds.playCoin();
                  g.coins += 1;
                  g.score += 100;
                  setCoins(g.coins);
                } else {
                  sounds.playNitro();
                  g.nitroActive = true;
                  g.nitroTime = 6.0;
                  setNitroActive(true);
                  setNitroTime(6);
                }
                g.scene.remove(item.mesh);
                g.collectibles.splice(i, 1);
                continue;
              }
              if (item.mesh.position.z > g.playerPos.z + 15) {
                g.scene.remove(item.mesh);
                g.collectibles.splice(i, 1);
              }
            }

            // Victory
            if (g.distanceM >= 12000) {
              sounds.playVictory();
              setGameState('VICTORY');
            }

            g.score += Math.floor(g.speed * dt * 1.5);
            setScore(g.score);
            setSpeed(Math.round(g.speed));
            setDistanceM(Math.floor(g.distanceM));
          }

          if (g.renderer && g.scene && g.camera) g.renderer.render(g.scene, g.camera);
          g.animId = requestAnimationFrame(tick);
        };
        g.animId = requestAnimationFrame(tick);
        return () => { if (g.animId) cancelAnimationFrame(g.animId); };
      }, [gameState]);

      const startGame = () => {
        sounds.init();
        const g = engineRef.current;
        g.playerPos = { x: 0, y: 0, z: 0 };
        g.speed = 0; g.distanceM = 0; g.score = 0; g.coins = 0;
        g.stageIdx = 0; g.nitroActive = false;
        g.traffic.forEach(t => g.scene.remove(t.mesh));
        g.traffic = [];
        g.collectibles.forEach(c => g.scene.remove(c.mesh));
        g.collectibles = [];
        setScore(0); setSpeed(0); setDistanceM(0); setCoins(0);
        setNitroActive(false);
        setGameState('PLAYING');
      };

      const progressRatio = Math.min(1, Math.max(0, distanceM / 12000));
      const progressPercent = Math.round(progressRatio * 100);
      const nextStage = STAGES.find(s => distanceM < s.startM) || null;
      const distToNext = nextStage ? (nextStage.startM - distanceM) : 0;
      const mapY = 145 - progressRatio * 125;
      const mapX = 65 + Math.sin(progressRatio * Math.PI * 1.5) * 22;

      return (
        <div style={{ width: '100%', height: '100%', position: 'relative' }}>
          <div ref={canvasContainerRef} style={{ width: '100%', height: '100%' }} />

          {/* HUD Overlay */}
          {gameState === 'PLAYING' && (
            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
              {/* GPS MINI-MAP HUD */}
              <div style={{ position: 'absolute', top: '14px', right: '16px', width: '165px', background: 'rgba(15, 23, 42, 0.92)', borderRadius: '14px', padding: '10px', border: '1.5px solid rgba(0, 240, 255, 0.4)', pointerEvents: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', fontSize: '12px' }}>
                  <span style={{ color: '#00f0ff', fontWeight: 'bold' }}>📡 ঢাকা জিপিএস ম্যাপ</span>
                  <span style={{ color: '#2ecc71', fontWeight: 'bold' }}>{progressPercent}%</span>
                </div>
                <div style={{ width: '100%', height: '150px', background: 'rgba(0,0,0,0.45)', borderRadius: '8px', position: 'relative' }}>
                  <svg width="100%" height="150" viewBox="0 0 130 155">
                    <path d="M 65 145 C 50 120, 85 95, 65 70 C 45 45, 75 30, 65 15" fill="none" stroke="#34495e" strokeWidth="8" strokeLinecap="round" />
                    <path d="M 65 145 C 50 120, 85 95, 65 70 C 45 45, 75 30, 65 15" fill="none" stroke="#00d2d3" strokeWidth="4" strokeDasharray="160" strokeDashoffset={160 - progressRatio * 160} strokeLinecap="round" />
                    <circle cx="65" cy="145" r="3.5" fill="#e67e22" /><text x="73" y="148" fill="#fff" fontSize="8">যাত্রাবাড়ী</text>
                    <circle cx="76" cy="108" r="3.5" fill="#9b59b6" /><text x="83" y="111" fill="#fff" fontSize="8">প্রগতি সরণি</text>
                    <circle cx="65" cy="70" r="4.0" fill="#3498db" /><text x="73" y="73" fill="#f1c40f" fontSize="8">কুড়িল</text>
                    <circle cx="54" cy="38" r="3.5" fill="#1abc9c" /><text x="5" y="41" fill="#fff" fontSize="8">এয়ারপোর্ট</text>
                    <circle cx="65" cy="15" r="4.5" fill="#2ecc71" /><text x="73" y="18" fill="#2ecc71" fontSize="8">উত্তরা 🏁</text>
                    <circle cx={mapX} cy={mapY} r="6" fill="rgba(0,240,255,0.3)" />
                    <circle cx={mapX} cy={mapY} r="3.5" fill="#00f0ff" stroke="#fff" strokeWidth="1.5" />
                  </svg>
                </div>
                <div style={{ marginTop: '6px', fontSize: '11px', color: '#cbd5e1', textAlign: 'center' }}>
                  {nextStage ? `পরবর্তী: ${nextStage.name} (${distToNext}মি)` : 'উত্তরা ফিনিশ লাইন সামনে!'}
                </div>
              </div>

              {/* Status Badges */}
              <div style={{ position: 'absolute', top: '14px', left: '16px', display: 'flex', gap: '10px', pointerEvents: 'auto' }}>
                <div style={{ background: 'rgba(15,23,42,0.88)', padding: '6px 14px', borderRadius: '12px', border: '1px solid #00d2d3', color: '#fff' }}>
                  <div style={{ fontSize: '10px', color: '#bdc3c7' }}>গতি</div>
                  <div style={{ fontSize: '22px', fontWeight: 'bold' }}>{speed} <span style={{ fontSize: '12px' }}>KM/H</span></div>
                </div>
                <div style={{ background: 'rgba(15,23,42,0.88)', padding: '6px 14px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.2)', color: '#f1c40f' }}>
                  <div style={{ fontSize: '10px', color: '#bdc3c7' }}>স্কোর</div>
                  <div style={{ fontSize: '20px', fontWeight: 'bold' }}>{score.toLocaleString()}</div>
                </div>
                <div style={{ background: 'rgba(15,23,42,0.88)', padding: '6px 14px', borderRadius: '12px', border: '1px solid #f39c12', color: '#2ecc71' }}>
                  <div style={{ fontSize: '10px', color: '#bdc3c7' }}>টাকা</div>
                  <div style={{ fontSize: '20px', fontWeight: 'bold' }}>৳ {coins}</div>
                </div>
                <button onClick={() => setIsMuted(sounds.toggleMute())} style={{ background: 'rgba(15,23,42,0.88)', border: '1px solid #fff', borderRadius: '12px', color: '#fff', fontSize: '18px', padding: '8px 12px', cursor: 'pointer' }}>
                  {isMuted ? '🔇' : '🔊'}
                </button>
              </div>

              {/* Nitro Banner */}
              {nitroActive && (
                <div style={{ position: 'absolute', top: '80px', left: '50%', transform: 'translateX(-50%)', background: 'linear-gradient(90deg, #e67e22, #d35400)', color: '#fff', padding: '8px 24px', borderRadius: '30px', fontWeight: 'bold', fontSize: '15px' }}>
                  🔥 টংয়ের লাল চা বুস্ট! স্পিড ১১০ কিমি/ঘণ্টা ({nitroTime}s)
                </div>
              )}

              {/* Popups */}
              {nearMissPopup && (
                <div style={{ position: 'absolute', top: '130px', left: '50%', transform: 'translateX(-50%)', background: 'rgba(231,76,60,0.95)', color: '#fff', padding: '8px 22px', borderRadius: '20px', fontWeight: 'bold' }}>
                  {nearMissPopup}
                </div>
              )}
              {stagePopup && (
                <div style={{ position: 'absolute', top: '35%', left: '50%', transform: 'translate(-50%, -50%)', background: 'rgba(15,23,42,0.94)', border: '2px solid #00f0ff', borderRadius: '16px', padding: '20px 36px', textAlign: 'center', color: '#fff' }}>
                  <div style={{ fontSize: '13px', color: '#00f0ff' }}>📍 নতুন মাইলস্টোন</div>
                  <div style={{ fontSize: '26px', fontWeight: 'bold' }}>{stagePopup.name}</div>
                  <div style={{ fontSize: '13px', color: '#bdc3c7' }}>{stagePopup.subtitle}</div>
                </div>
              )}

              {/* Mobile Buttons */}
              <div style={{ position: 'absolute', bottom: '22px', left: '16px', right: '16px', display: 'flex', justifyContent: 'space-between', pointerEvents: 'auto' }}>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onTouchStart={() => engineRef.current.keys.left = true} onTouchEnd={() => engineRef.current.keys.left = false} onMouseDown={() => engineRef.current.keys.left = true} onMouseUp={() => engineRef.current.keys.left = false} style={{ width: '68px', height: '62px', borderRadius: '14px', background: '#1a202c', color: '#fff', fontSize: '15px', fontWeight: 'bold', border: '2px solid #fff' }}>◀ বামে</button>
                  <button onTouchStart={() => engineRef.current.keys.right = true} onTouchEnd={() => engineRef.current.keys.right = false} onMouseDown={() => engineRef.current.keys.right = true} onMouseUp={() => engineRef.current.keys.right = false} style={{ width: '68px', height: '62px', borderRadius: '14px', background: '#1a202c', color: '#fff', fontSize: '15px', fontWeight: 'bold', border: '2px solid #fff' }}>ডানে ▶</button>
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onClick={triggerHorn} style={{ width: '64px', height: '62px', borderRadius: '14px', background: '#e67e22', color: '#fff', fontSize: '13px', fontWeight: 'bold', border: '2px solid #fff' }}>📢 হর্ন</button>
                  <button onTouchStart={() => engineRef.current.keys.down = true} onTouchEnd={() => engineRef.current.keys.down = false} onMouseDown={() => engineRef.current.keys.down = true} onMouseUp={() => engineRef.current.keys.down = false} style={{ width: '64px', height: '62px', borderRadius: '14px', background: '#c0392b', color: '#fff', fontSize: '13px', fontWeight: 'bold', border: '2px solid #fff' }}>🛑 ব্রেক</button>
                  <button onTouchStart={() => engineRef.current.keys.up = true} onTouchEnd={() => engineRef.current.keys.up = false} onMouseDown={() => engineRef.current.keys.up = true} onMouseUp={() => engineRef.current.keys.up = false} style={{ width: '64px', height: '62px', borderRadius: '14px', background: '#27ae60', color: '#fff', fontSize: '13px', fontWeight: 'bold', border: '2px solid #fff' }}>🚀 গতি</button>
                </div>
              </div>
            </div>
          )}

          {/* START MODAL */}
          {gameState === 'START' && (
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#1a202c', border: '2px solid #00f0ff', borderRadius: '18px', padding: '30px', maxWidth: '500px', width: '90%', textAlign: 'center', color: '#fff' }}>
                <div style={{ fontSize: '46px', marginBottom: '4px' }}>🏍️💨</div>
                <h1 style={{ margin: '0 0 6px 0', fontSize: '28px' }}>ঢাকা বাইক রাশ ৩ডি</h1>
                <h3 style={{ margin: '0 0 16px 0', color: '#f1c40f', fontSize: '15px' }}>যাত্রাবাড়ী ➔ প্রগতি সরণি ➔ কুড়িল ফ্লাইওভার ➔ উত্তরা (১২ কিমি)</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', textAlign: 'left', background: 'rgba(255,255,255,0.06)', padding: '12px', borderRadius: '10px', fontSize: '13px', marginBottom: '16px' }}>
                  <div>🏍️ স্পোর্টস বাইক: স্মুথ টার্নিং</div>
                  <div>📡 জিপিএস ম্যাপ: রুট ট্র্যাকার</div>
                  <div>🏢 ঢাকা সিটি: দোকান ও বিলবোর্ড</div>
                  <div>📢 হর্ন দিলে: রিকশা সাইড দেবে</div>
                </div>
                <p style={{ fontSize: '13px', color: '#bdc3c7', marginBottom: '20px' }}>
                  কন্ট্রোল: ⬅️ / ➡️ ডানে-বামে | ⬆️ গতি বাড়ানো | ⬇️ ব্রেক | Space / H হর্ন
                </p>
                <button onClick={startGame} style={{ background: 'linear-gradient(135deg, #0984e3, #00cec9)', border: 'none', color: '#fff', fontSize: '18px', fontWeight: 'bold', padding: '14px 40px', borderRadius: '30px', cursor: 'pointer' }}>
                  রাইড শুরু করুন 🚀
                </button>
              </div>
            </div>
          )}

          {/* GAME OVER MODAL */}
          {gameState === 'GAMEOVER' && (
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.82)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#1a202c', border: '2px solid #e74c3c', borderRadius: '18px', padding: '30px', maxWidth: '450px', width: '90%', textAlign: 'center', color: '#fff' }}>
                <div style={{ fontSize: '50px', marginBottom: '8px' }}>💥</div>
                <h1 style={{ color: '#e74c3c', margin: '0 0 6px 0' }}>মামা দেইখা চালান!</h1>
                <p style={{ color: '#bdc3c7', fontSize: '14px' }}>দুর্ঘটনায় বাইক ক্র্যাশ করেছে!</p>
                <div style={{ background: 'rgba(255,255,255,0.06)', borderRadius: '10px', padding: '12px', margin: '16px 0', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>দূরত্ব:</span><strong style={{ color: '#3498db' }}>{distanceM} মিটার</strong></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>মোট স্কোর:</span><strong style={{ color: '#f1c40f' }}>{score.toLocaleString()}</strong></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>কালেক্টেড টাকা:</span><strong style={{ color: '#2ecc71' }}>৳ {coins}</strong></div>
                </div>
                <button onClick={startGame} style={{ background: '#e74c3c', border: 'none', color: '#fff', fontSize: '16px', fontWeight: 'bold', padding: '12px 34px', borderRadius: '30px', cursor: 'pointer' }}>
                  আবার চেষ্টা করুন 🔄
                </button>
              </div>
            </div>
          )}

          {/* VICTORY MODAL */}
          {gameState === 'VICTORY' && (
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#1a202c', border: '2px solid #2ecc71', borderRadius: '18px', padding: '30px', maxWidth: '480px', width: '90%', textAlign: 'center', color: '#fff' }}>
                <div style={{ fontSize: '54px', marginBottom: '8px' }}>🏆🏁</div>
                <h1 style={{ color: '#2ecc71', margin: '0 0 6px 0' }}>অভিনন্দন!</h1>
                <h3 style={{ color: '#f1c40f', margin: '0 0 12px 0' }}>আপনি নিরাপদে উত্তরা হাউস বিল্ডিং পৌঁছেছেন!</h3>
                <p style={{ fontSize: '14px', color: '#bdc3c7' }}>যাত্রাবাড়ী থেকে পুরো ১২ কিমি পথ সফলভাবে অতিক্রম করেছেন!</p>
                <button onClick={startGame} style={{ background: '#27ae60', border: 'none', color: '#fff', fontSize: '16px', fontWeight: 'bold', padding: '14px 36px', borderRadius: '30px', cursor: 'pointer' }}>
                  আবার ড্রাইভ করুন 🚀
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
